name: Flujo de trabajo CI/CD para API Concesionario (Node.js + Express)

# Permisos para poder subir la imagen docker al registro de GitHub
permissions:
  contents: read
  packages: write

# Se dispara al hacer push en cualquier rama
on:
  push:
    branches:
      - '**'

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Configurar el entorno de Node.js en el servidor de GitHub
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Versión LTS estable de Node.js

      # 3. Instalar dependencias para validar que no hay fallos de sintaxis
      - name: Instalar dependencias locales
        run: |
          npm install
          # npm test

      # 4. Construir la imagen Docker usando el Dockerfile de Node.js
      - name: Build Docker image
        run: docker build -t ghcr.io/${{ github.repository }}:latest .

      # 5. Iniciar sesión en GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Subir la imagen Docker a GitHub
      - name: Push image to GHCR
        run: docker push ghcr.io/${{ github.repository }}:latest

      # 7. DESPLIEGUE EN AWS: Conectarse por SSH a tu instancia y relanzar la app
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p ~/api_concesionario
            cd ~/api_concesionario

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ github.repository }}:latest

            docker stop api_concesionario_app 2>/dev/null || true
            docker rm api_concesionario_app 2>/dev/null || true

            docker run -d \
              --name api_concesionario_app \
              -p 3000:3000 \
              --restart always \
              ghcr.io/${{ github.repository }}:latest
