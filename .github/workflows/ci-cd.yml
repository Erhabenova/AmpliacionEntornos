name: Flujo de trabajo CI/CD para API Concesionario (Node.js + Express)

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - '**'

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Instalar dependencias locales
        run: npm install

      - name: Build Docker image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$REPO_LOWER:latest .

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker push ghcr.io/$REPO_LOWER:latest

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p ~/api_concesionario
            cd ~/api_concesionario
            
            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            ACTOR_LOWER=$(echo "${{ github.actor }}" | tr '[:upper:]' '[:lower:]')
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ACTOR_LOWER --password-stdin
            docker pull ghcr.io/$REPO_LOWER:latest
            
            docker stop api_concesionario_app 2>/dev/null || true
            docker rm api_concesionario_app 2>/dev/null || true
            
            docker run -d \
              --name api_concesionario_app \
              -p 3000:3000 \
              -e PORT=3000 \
              -e DB_HOST=172.17.0.1 \
              -e DB_USER=isidoronm \
              -e DB_PASSWORD=mm123 \
              -e DB_DATABASE=concesionario_msr \
              --restart always \
              ghcr.io/$REPO_LOWER:latest